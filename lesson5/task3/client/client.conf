client
dev tun0
proto udp4

remote 192.168.80.131 1194
resolv-retry infinite
nobind

persist-key
persist-tun

remote-cert-tls server

ca /etc/openvpn/client/ca.crt
cert /etc/openvpn/client/client.crt
key /etc/openvpn/client/client.key
tls-auth /etc/openvpn/client/ta.key 1

script-security 2
up /etc/openvpn/client/vpn-dns.sh
down /etc/openvpn/client/vpn-dns.sh
down-pre

verb 3
